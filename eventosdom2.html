<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculando Números</title>
    <style>

        div#res{
            margin-top: 20px;
            background-color: forestgreen;
            width: 120px;
            height: 120px;
            line-height: 40px;
            text-align: center;
        }
        
    </style>
</head>
<body>
    <h1>
      Calcular Valores  
    </h1>
    <input type="number" name="txtn1" id="txtn1"> 
    <input type="number" name="txtn2" id="txtn2"><br>
    <input type="button" value="Somar" onclick="somar()"><br>
    <input type="button" value="Subtrair" onclick="subtrair()"><br>
    <input type="button" value="Multiplicar" onclick="multiplicar()"><br>
    <input type="button" value="Dividir" onclick="dividir()"><br>
    <input type="button" value="Resto" onclick="modulo()"><br>
    <div id = 'res'>Resultado</div>
    <script>
        function somar(){
            var tn1 = window.document.getElementById('txtn1') 
            var tn2 = window.document.querySelector('input#txtn2')
            var res = window.document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var soma = n1 + n2
            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a <strong> ${soma}</strong>`       
        }   
        function multiplicar(){
            var tn1 = window.document.getElementById('txtn1') 
            var tn2 = window.document.querySelector('input#txtn2')
            var res = window.document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var multiplica = n1 * n2
            res.innerHTML = `A multiplicação entre ${n1} e ${n2} é igual a <strong> ${multiplica}</strong>`
        }
        function subtrair(){
            var tn1 = window.document.getElementById('txtn1') 
            var tn2 = window.document.querySelector('input#txtn2')
            var res = window.document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var subtrai = n1 - n2
            res.innerHTML = `A subtração entre ${n1} e ${n2} é igual a <strong> ${subtrai}</strong>`
        }
        function dividir(){
            var tn1 = window.document.getElementById('txtn1') 
            var tn2 = window.document.querySelector('input#txtn2')
            var res = window.document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var divisao = n1 / n2
            res.innerHTML = `A divisão entre ${n1} e ${n2} é igual a <strong> ${divisao}</strong>`
        }
        function modulo(){
            var tn1 = window.document.getElementById('txtn1') 
            var tn2 = window.document.querySelector('input#txtn2')
            var res = window.document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var modulo = n1 % n2
            res.innerHTML = `o resto da divisão entre ${n1} e ${n2} é igual a <strong> ${modulo}</strong>`
        }
    </script>
</body>
</html>
